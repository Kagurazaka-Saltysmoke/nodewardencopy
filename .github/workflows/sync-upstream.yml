name: Sync upstream

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      target_commit:
        description: 'Commit hash (leave blank to use latest commit)'
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: sync-upstream-${{ github.repository }}
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Add upstream
        run: |
          git remote add upstream https://github.com/shuaiplus/NodeWarden.git || true
          # Fetch branches to a dedicated ref namespace (avoid polluting refs/tags)
          git fetch upstream '+refs/heads/*:refs/remotes/upstream/*'

      - name: Resolve target commit
        id: resolve
        run: |
          TRIGGER="${{ github.event_name }}"
          MANUAL_INPUT="${{ github.event.inputs.target_commit }}"

          if [ "$TRIGGER" = "schedule" ]; then
            # Auto mode: resolve latest upstream release tag
            LATEST_TAG=$(curl -s https://api.github.com/repos/shuaiplus/NodeWarden/releases/latest | jq -r .tag_name)
            if [ "$LATEST_TAG" = "null" ] || [ -z "$LATEST_TAG" ]; then
              echo "No release found in upstream."
              exit 1
            fi
            # Fetch just that tag into a dedicated namespace, then resolve its commit.
            # This avoids the race where a release published between fetch and resolve
            # is not present locally, and avoids clobbering local refs/tags.
            git fetch upstream "+refs/tags/$LATEST_TAG:refs/tags/upstream-release/$LATEST_TAG" || true
            TARGET_SHA=$(git rev-parse "refs/tags/upstream-release/$LATEST_TAG^{}" 2>/dev/null)
            if [ -z "$TARGET_SHA" ]; then
              # Fallback: resolve from the branch refs we already fetched
              TARGET_SHA=$(git rev-parse "refs/remotes/upstream/main" 2>/dev/null || true)
            fi
            if [ -z "$TARGET_SHA" ]; then
              echo "Tag '$LATEST_TAG' not found after fetch."
              exit 1
            fi
            echo "mode=auto" >> $GITHUB_OUTPUT
            echo "latest_tag=$LATEST_TAG" >> $GITHUB_OUTPUT
            echo "target_sha=$TARGET_SHA" >> $GITHUB_OUTPUT
            echo "Auto mode — latest release: $LATEST_TAG ($TARGET_SHA)"

          elif [ -n "$MANUAL_INPUT" ]; then
            # Manual mode: use provided commit hash or tag
            TARGET_SHA=$(git rev-parse "$MANUAL_INPUT" 2>/dev/null || git rev-parse "refs/tags/$MANUAL_INPUT" 2>/dev/null || true)
            if [ -z "$TARGET_SHA" ]; then
              echo "Cannot resolve '$MANUAL_INPUT' to a commit."
              exit 1
            fi
            echo "mode=manual" >> $GITHUB_OUTPUT
            echo "target_sha=$TARGET_SHA" >> $GITHUB_OUTPUT
            echo "Manual mode — target: $MANUAL_INPUT ($TARGET_SHA)"

          else
            # Manual mode, blank input: use latest commit on upstream/main
            TARGET_SHA=$(git rev-parse refs/remotes/upstream/main)
            echo "mode=manual" >> $GITHUB_OUTPUT
            echo "target_sha=$TARGET_SHA" >> $GITHUB_OUTPUT
            echo "Manual mode — latest commit: $TARGET_SHA"
          fi

      - name: Check if update is needed
        id: check
        run: |
          TARGET_SHA="${{ steps.resolve.outputs.target_sha }}"

          # Tree comparison: ignore whitelist paths (.github + wrangler.toml),
          # if remaining tree is identical → skip
          if git diff --quiet "$TARGET_SHA" HEAD -- . \
            ':(exclude).github' \
            ':(exclude)wrangler.toml'; then
            echo "Already up to date with $TARGET_SHA — skipping."
            echo "needs_update=false" >> $GITHUB_OUTPUT
          else
            echo "Update needed — target: $TARGET_SHA"
            echo "needs_update=true" >> $GITHUB_OUTPUT
          fi

      - name: Apply update
        if: steps.check.outputs.needs_update == 'true'
        run: |
          set -euo pipefail

          TARGET_SHA="${{ steps.resolve.outputs.target_sha }}"

          KEEP_DIR="/tmp/keep"
          mkdir -p "$KEEP_DIR"

          # --- Whitelist definition: .github 整目录 + wrangler.toml ---
          # .github 完全保留本地版（含本 workflow 自身 + dependabot），
          # 这样 commit 不含 workflow 文件变更，push 无需 workflows 权限，
          # 也不会把上游的 workflow 漂移进来。
          WHITELIST_DIRS=( ".github" )
          WHITELIST_FILES=( "wrangler.toml" )

          # 1. Backup whitelist directories
          for dir in "${WHITELIST_DIRS[@]}"; do
            if [ -d "$dir" ]; then
              mkdir -p "$KEEP_DIR/$dir"
              cp -r "$dir/." "$KEEP_DIR/$dir/"
              echo "Backed up directory: $dir"
            fi
          done

          # Backup whitelist files
          for f in "${WHITELIST_FILES[@]}"; do
            if [ -f "$f" ]; then
              mkdir -p "$KEEP_DIR/$(dirname "$f")"
              cp "$f" "$KEEP_DIR/$f"
              echo "Backed up file: $f"
            else
              echo "::warning::Whitelist file not found, skipping backup: $f"
            fi
          done

          # 2. Nuke all tracked files
          git rm -rq --ignore-unmatch .

          # 3. Checkout upstream tree at TARGET_SHA (exclude .github + whitelist files)
          git checkout "$TARGET_SHA" -- . ':(exclude).github' ':(exclude)wrangler.toml'

          # 4. Restore whitelist files from backup
          for dir in "${WHITELIST_DIRS[@]}"; do
            if [ -d "$KEEP_DIR/$dir" ]; then
              mkdir -p "$dir"
              cp -r "$KEEP_DIR/$dir/." "$dir/"
              echo "Restored directory: $dir"
            fi
          done

          for f in "${WHITELIST_FILES[@]}"; do
            if [ -f "$KEEP_DIR/$f" ]; then
              mkdir -p "$(dirname "$f")"
              cp "$KEEP_DIR/$f" "$f"
              echo "Restored file: $f"
            fi
          done

          # 5. Diff alert: compare upstream vs local for each whitelist entry
          echo "### ⚠️ Whitelist Diff Report" >> $GITHUB_STEP_SUMMARY

          HAS_DIFF=false

          # Report upstream changes in whitelist paths (added/removed/modified),
          # then byte-compare each local whitelist file against upstream.
          # Use git diff --name-status to cover upstream additions we don't have locally.
          while IFS= read -r status_path; do
            [ -n "$status_path" ] || continue
            st="${status_path%%$'\t'*}"
            rel_path="${status_path#*$'\t'}"
            case "$st" in
              A|M|D|T)
                echo "- ⚠️ \`$rel_path\` — upstream ${st}: review manually" >> $GITHUB_STEP_SUMMARY
                HAS_DIFF=true
                ;;
            esac
          done < <(git diff --name-status "$TARGET_SHA" HEAD -- .github wrangler.toml)

          # Check files inside whitelist directories
          for dir in "${WHITELIST_DIRS[@]}"; do
            if [ -d "$KEEP_DIR/$dir" ]; then
              while IFS= read -r -d '' local_file; do
                rel_path="${local_file#$KEEP_DIR/}"
                if ! git cat-file -e "$TARGET_SHA:$rel_path" 2>/dev/null; then
                  echo "- ℹ️ \`$rel_path\` — 本地预期保留（上游不存在）" >> $GITHUB_STEP_SUMMARY
                elif ! git show "$TARGET_SHA:$rel_path" | cmp -s - "$rel_path"; then
                  echo "- ⚠️ \`$rel_path\` — differs from upstream; review manually" >> $GITHUB_STEP_SUMMARY
                  HAS_DIFF=true
                fi
              done < <(find "$KEEP_DIR/$dir" -type f -print0)
            fi
          done

          # Check individual whitelist files
          for f in "${WHITELIST_FILES[@]}"; do
            if [ -f "$f" ]; then
              if ! git cat-file -e "$TARGET_SHA:$f" 2>/dev/null; then
                echo "- ℹ️ \`$f\` — 本地预期保留（上游不存在）" >> $GITHUB_STEP_SUMMARY
              elif ! git show "$TARGET_SHA:$f" | cmp -s - "$f"; then
                echo "- ⚠️ \`$f\` — differs from upstream; review manually" >> $GITHUB_STEP_SUMMARY
                HAS_DIFF=true
              fi
            fi
          done

          if [ "$HAS_DIFF" = false ]; then
            echo "- ✅ All whitelist files match upstream — no action needed" >> $GITHUB_STEP_SUMMARY
          fi

          # 6. Commit
          git add -A
          # --allow-empty should not happen, but guard just in case
          if git diff --cached --quiet; then
            echo "No changes to commit after overlay — skipping."
          else
            git commit -m "chore: sync with upstream $TARGET_SHA"
          fi

          rm -rf "$KEEP_DIR"

      - name: Push
        if: steps.check.outputs.needs_update == 'true'
        run: |
          git push origin main

      - name: Summary
        run: |
          if [ "${{ steps.check.outputs.needs_update }}" = "true" ]; then
            echo "### Synced successfully" >> $GITHUB_STEP_SUMMARY
            echo "- **Mode:** ${{ steps.resolve.outputs.mode }}" >> $GITHUB_STEP_SUMMARY
            echo "- **Tag:** ${{ steps.resolve.outputs.latest_tag || 'N/A (manual)' }}" >> $GITHUB_STEP_SUMMARY
            echo "- **Commit:** \`${{ steps.resolve.outputs.target_sha }}\`" >> $GITHUB_STEP_SUMMARY
          else
            echo "### Nothing to update" >> $GITHUB_STEP_SUMMARY
          fi
